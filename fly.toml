# Fly.io 部署（可完全不依赖 GitHub：本地目录直接 fly deploy）
# 用法：
#   fly launch --no-deploy --dockerfile Dockerfile  (生成/确认本文件)
#   fly postgres create --name savoru-db
#   fly postgres attach --app savoru savoru-db       (注入 DATABASE_URL)
#   fly secrets set JWT_SECRET=... COOKIE_SECRET=... ADMIN_PASSWORD=... NODE_ENV=production COOKIE_SECURE=true
#   fly deploy
app = "savoru"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  COOKIE_SECURE = "true"
  ACCESS_TOKEN_TTL = "2h"
  REFRESH_TOKEN_TTL_DAYS = "30"
  ADMIN_USERNAME = "admin"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # 首次启动先迁移并写入种子，再启动服务
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512